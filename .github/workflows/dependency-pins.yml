name: dependency-pins

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Dependency pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned first-party dependencies
        run: python3 -B scripts/prepare-ci-dependencies.py --verify-pins
